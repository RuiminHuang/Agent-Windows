# ============================================================
# Zotero MCP v1
# ============================================================

[mcp_servers.zotero-mcp-v1]
url = "http://127.0.0.1:23120/mcp"
enabled = true
default_tools_approval_mode = "approve"

# These destructive operations require confirmation.

[mcp_servers.zotero-mcp-v1.tools.delete_collection]
approval_mode = "prompt"

[mcp_servers.zotero-mcp-v1.tools.remove_items_from_collection]
approval_mode = "prompt"


# ============================================================
# Zotero MCP v2
# ============================================================

[mcp_servers.zotero-mcp-v2]
command = 'C:\Users\Ruimin Huang\.conda\envs\slide\Scripts\zotero-mcp.exe'
args = []
enabled = true
default_tools_approval_mode = "approve"

[mcp_servers.zotero-mcp-v2.env]
ZOTERO_LOCAL = "true"
ZOTERO_EMBEDDING_MODEL = "default"
PYTHONIOENCODING = "utf-8"

# These destructive / batch operations require confirmation.

[mcp_servers.zotero-mcp-v2.tools.zotero_delete_item]
approval_mode = "prompt"

[mcp_servers.zotero-mcp-v2.tools.zotero_delete_collection]
approval_mode = "prompt"

[mcp_servers.zotero-mcp-v2.tools.zotero_delete_annotation]
approval_mode = "prompt"

[mcp_servers.zotero-mcp-v2.tools.zotero_batch_update]
approval_mode = "prompt"


